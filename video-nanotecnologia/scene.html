<!doctype html>
<html><head><meta charset="utf-8"><title>Nano video renderer</title>
<style>html,body{margin:0;background:#050b1a;overflow:hidden}canvas{display:block}</style></head>
<body><canvas id="c" width="1920" height="1080"></canvas>
<script>
const W = 1920, H = 1080;
const cv = document.getElementById('c'), g = cv.getContext('2d');
const FONT = '"DejaVu Sans", "Liberation Sans", sans-serif';
const C = { bg0:'#040916', bg1:'#0b1a3a', cyan:'#38e1ff', mag:'#ff4fd8', gold:'#ffc54a', green:'#4dffa6', text:'#eaf2ff', dim:'#8ea3c7', red:'#ff5a5a' };
let SCENES = null, TL = null;

// ---------- utilidades ----------
const clamp = (x, a=0, b=1) => Math.max(a, Math.min(b, x));
const ease = x => { x = clamp(x); return x < .5 ? 4*x*x*x : 1 - Math.pow(-2*x + 2, 3) / 2; };
const eout = x => 1 - Math.pow(1 - clamp(x), 3);
const lerp = (a, b, t) => a + (b - a) * t;
function rng(seed) { let s = seed >>> 0; return () => ((s = (s * 1664525 + 1013904223) >>> 0) / 4294967296); }
function glowDot(x, y, r, col, a=1, glow=2.6) {
  g.save(); g.globalAlpha = a;
  const gr = g.createRadialGradient(x, y, 0, x, y, r * glow);
  gr.addColorStop(0, col); gr.addColorStop(0.35, col + '88'); gr.addColorStop(1, col + '00');
  g.fillStyle = gr; g.beginPath(); g.arc(x, y, r * glow, 0, 7); g.fill();
  const sp = g.createRadialGradient(x - r*.35, y - r*.35, r*.1, x, y, r);
  sp.addColorStop(0, '#ffffff'); sp.addColorStop(0.25, col); sp.addColorStop(1, shade(col, -0.45));
  g.fillStyle = sp; g.beginPath(); g.arc(x, y, r, 0, 7); g.fill(); g.restore();
}
function shade(hex, k) {
  const n = parseInt(hex.slice(1), 16); let r = n >> 16, gg = (n >> 8) & 255, b = n & 255;
  const f = v => Math.round(k < 0 ? v * (1 + k) : v + (255 - v) * k);
  return '#' + [f(r), f(gg), f(b)].map(v => v.toString(16).padStart(2, '0')).join('');
}
function text(s, x, y, size, col=C.text, align='left', weight='bold', a=1) {
  g.save(); g.globalAlpha = a; g.fillStyle = col; g.font = `${weight} ${size}px ${FONT}`; g.textAlign = align; g.textBaseline = 'alphabetic';
  g.fillText(s, x, y); g.restore();
}
function wrap(s, maxW, size, weight='bold') {
  g.font = `${weight} ${size}px ${FONT}`; const words = s.split(' '); const lines = []; let cur = '';
  for (const w of words) { const t = cur ? cur + ' ' + w : w; if (g.measureText(t).width > maxW && cur) { lines.push(cur); cur = w; } else cur = t; }
  if (cur) lines.push(cur); return lines;
}
function rrect(x, y, w, h, r) { g.beginPath(); g.moveTo(x + r, y); g.arcTo(x + w, y, x + w, y + h, r); g.arcTo(x + w, y + h, x, y + h, r); g.arcTo(x, y + h, x, y, r); g.arcTo(x, y, x + w, y, r); g.closePath(); }

// ---------- fondo ----------
const BGP = (() => { const r = rng(7); return Array.from({length: 140}, () => ({x: r()*W, y: r()*H, z: .3 + r()*.9, p: r()*6.28})); })();
function background(T, hue=0) {
  const gr = g.createLinearGradient(0, 0, W, H); gr.addColorStop(0, C.bg0); gr.addColorStop(1, C.bg1);
  g.fillStyle = gr; g.fillRect(0, 0, W, H);
  // hexágonos tenues
  g.save(); g.globalAlpha = .06; g.strokeStyle = C.cyan; g.lineWidth = 1.2;
  const s = 46, off = (T * 6) % (s * 3);
  for (let row = -1; row < H / (s * .866) + 1; row++) for (let col = -1; col < W / (s * 3) + 2; col++) {
    const cx = col * s * 3 + (row % 2) * s * 1.5 - off, cy = row * s * .866;
    g.beginPath(); for (let k = 0; k < 6; k++) { const a = k * Math.PI / 3; g.lineTo(cx + s * .5 * Math.cos(a) * 1.15, cy + s * .5 * Math.sin(a) * 1.15); } g.closePath(); g.stroke();
  }
  g.restore();
  for (const p of BGP) {
    const x = (p.x + T * 12 * p.z) % W, y = p.y + Math.sin(T * .4 + p.p) * 14;
    g.globalAlpha = .25 * p.z; g.fillStyle = hue ? C.mag : C.cyan; g.beginPath(); g.arc(x, y, 1.6 * p.z, 0, 7); g.fill();
  }
  g.globalAlpha = 1;
  const vg = g.createRadialGradient(W/2, H/2, H*.3, W/2, H/2, H*.95); vg.addColorStop(0, '#00000000'); vg.addColorStop(1, '#000000aa');
  g.fillStyle = vg; g.fillRect(0, 0, W, H);
}

// ---------- capas de texto comunes ----------
function header(sc, t) {
  if (!sc.kicker) return;
  const a = eout(t / .8);
  g.save(); g.translate(0, (1 - a) * 20);
  text(sc.kicker, 110, 120, 26, C.cyan, 'left', 'bold', a);
  g.fillStyle = C.cyan; g.globalAlpha = a; g.fillRect(110, 136, 90 * a, 4); g.globalAlpha = 1;
  const tl = wrap(sc.title, 800, 58);
  tl.forEach((l, i) => text(l, 110, 205 + i * 68, 58, C.text, 'left', 'bold', a));
  g.restore();
  return 205 + tl.length * 68;
}
function bullets(sc, t, d, y0) {
  const n = sc.bullets.length; if (!n) return;
  const span = Math.max(1, d - 3);
  sc.bullets.forEach((b, i) => {
    const ts = .8 + i * span / n, a = eout((t - ts) / .6);
    if (a <= 0) return;
    const y = y0 + 40 + i * 74;
    g.save(); g.globalAlpha = a; g.translate((1 - a) * -30, 0);
    rrect(110, y - 40, 760, 60, 14); g.fillStyle = '#0e2350cc'; g.fill(); g.strokeStyle = '#38e1ff44'; g.lineWidth = 1.5; g.stroke();
    glowDot(140, y - 10, 7, i % 2 ? C.mag : C.cyan, 1, 2);
    g.restore();
    let fs = 28; g.font = `bold ${fs}px ${FONT}`; while (g.measureText(b).width > 690 && fs > 18) { fs--; g.font = `bold ${fs}px ${FONT}`; }
    text(b, 165, y - (28 - fs) / 3, fs, C.text, 'left', 'bold', a);
  });
}
function refs(sc, t) {
  if (!sc.refs || !sc.refs.length) return;
  const a = eout((t - 1.2) / .8);
  const lines = [];
  sc.refs.forEach(r => wrap(r, 790, 16, 'normal').forEach((l, k) => lines.push([l, k === 0])));
  const h = 44 + lines.length * 21, y = 890 - h;
  g.save(); g.globalAlpha = a * .95;
  rrect(110, y, 830, h, 12); g.fillStyle = '#020611d0'; g.fill(); g.strokeStyle = '#ffc54a55'; g.stroke();
  g.restore();
  text('FUENTE' + (sc.refs.length > 1 ? 'S' : '') + ' CIENTÍFICA' + (sc.refs.length > 1 ? 'S' : ''), 130, y + 26, 15, C.gold, 'left', 'bold', a);
  lines.forEach(([l, first], i) => text(l, 130, y + 48 + i * 21, 16, first ? '#dfe7f5' : '#b8c4da', 'left', 'normal', a));
}
function subtitles(scT, t) {
  const ln = scT.lines.find(l => t >= l.start - .1 && t <= l.end + .35);
  if (!ln) return;
  const a = clamp((t - ln.start + .1) / .2) * clamp((ln.end + .35 - t) / .2);
  const lines = wrap(ln.sub, 1600, 38, 'bold');
  const h = lines.length * 50 + 26, y = 1052 - h;
  g.save(); g.globalAlpha = a;
  g.font = `bold 38px ${FONT}`; const w = Math.max(...lines.map(l => g.measureText(l).width)) + 60;
  rrect(W/2 - w/2, y, w, h, 14); g.fillStyle = '#000000b8'; g.fill();
  lines.forEach((l, i) => { g.fillStyle = '#ffffff'; g.textAlign = 'center'; g.fillText(l, W/2, y + 48 + i * 50); });
  g.restore();
}
function progressBar(T) {
  const p = T / TL.total; g.fillStyle = '#ffffff14'; g.fillRect(0, H - 6, W, 6);
  const gr = g.createLinearGradient(0, 0, W, 0); gr.addColorStop(0, C.cyan); gr.addColorStop(1, C.mag);
  g.fillStyle = gr; g.fillRect(0, H - 6, W * p, 6);
}

// ---------- visuales por escena (área: x 960–1820, y 170–800) ----------
const VX = 1390, VY = 480;
const V = {};

V.intro = (t, d, sc, scT) => {
  const r = rng(3), N = 260, p = ease((t - .5) / 5);
  // nube -> red hexagonal
  const pts = [];
  for (let row = -6; row <= 6; row++) for (let col = -11; col <= 11; col++) {
    const x = W/2 + col * 52 + (row % 2 ? 26 : 0), y = 470 + row * 45;
    if (Math.hypot(x - W/2, (y - 470) * 1.6) < 560) pts.push([x, y]);
  }
  g.save(); g.globalAlpha = .35 * p; g.strokeStyle = C.cyan; g.lineWidth = 1.5;
  for (let i = 0; i < pts.length; i++) for (let j = i + 1; j < pts.length; j++) {
    const dx = pts[i][0] - pts[j][0], dy = pts[i][1] - pts[j][1];
    if (dx*dx + dy*dy < 53*53) { g.beginPath(); g.moveTo(pts[i][0], pts[i][1]); g.lineTo(pts[j][0], pts[j][1]); g.stroke(); }
  }
  g.restore();
  pts.forEach((q, i) => {
    const sx = r() * W, sy = r() * H, ph = r() * 6.28;
    const k = ease(p * 1.3 - (i % 40) / 120);
    const x = lerp(sx + Math.sin(t + ph) * 40, q[0], k), y = lerp(sy + Math.cos(t * .8 + ph) * 40, q[1] + Math.sin(t * 2 + q[0] * .01) * 4 * k, k);
    glowDot(x, y, 4.5, i % 7 ? C.cyan : C.mag, .9, 2.5);
  });
  const a = eout((t - 2.5) / 1.2);
  g.save(); g.globalAlpha = a; g.fillStyle = '#050b1acc'; rrect(W/2 - 640, 330, 1280, 290, 30); g.fill(); g.restore();
  text('LO QUE PUEDES HACER CON LA', W/2, 410, 40, C.cyan, 'center', 'bold', a);
  g.save(); g.globalAlpha = a; g.font = `bold 128px ${FONT}`; g.textAlign = 'center';
  const gr = g.createLinearGradient(W/2 - 600, 0, W/2 + 600, 0); gr.addColorStop(0, C.cyan); gr.addColorStop(.5, '#ffffff'); gr.addColorStop(1, C.mag);
  g.fillStyle = gr; g.shadowColor = C.cyan; g.shadowBlur = 30; g.fillText('NANOTECNOLOGÍA', W/2, 545, 1240); g.restore();
  text('Un viaje basado en artículos científicos', W/2, 595, 30, C.dim, 'center', 'normal', a);
};

V.scale = (t, d) => {
  const items = [
    {n: 'Cabello humano', v: 80000, col: '#d9a46a'}, {n: 'Glóbulo rojo', v: 7000, col: '#ff5a5a'},
    {n: 'Bacteria', v: 1000, col: '#4dffa6'}, {n: 'Virus', v: 100, col: '#ff4fd8'},
    {n: 'Proteína', v: 10, col: '#ffc54a'}, {n: 'ADN (ancho)', v: 2.5, col: '#38e1ff'}, {n: 'Átomo', v: 0.1, col: '#ffffff'}];
  const x0 = 1060, x1 = 1730, ly = 640;
  const lx = v => lerp(x1, x0, (Math.log10(v) + 1) / 6);
  const a = eout(t / 1);
  g.save(); g.globalAlpha = a; g.strokeStyle = C.dim; g.lineWidth = 3; g.beginPath(); g.moveTo(x0 - 20, ly); g.lineTo(x1 + 20, ly); g.stroke();
  for (let e = -1; e <= 5; e++) { const x = lx(Math.pow(10, e)); g.fillStyle = C.dim; g.fillRect(x - 1.5, ly - 10, 3, 20); text(e === -1 ? '0.1 nm' : (Math.pow(10, e)).toLocaleString('en-US') + ' nm', x, ly + 42, 15, C.dim, 'center', 'normal', a); }
  g.restore();
  const cur = 5.2 - ease((t - 2) / (d * .55)) * 6.2; // exponente actual del "zoom"
  items.forEach((it, i) => {
    const x = lx(it.v), le = Math.log10(it.v), on = clamp(1 - Math.abs(le - cur) / 1.2);
    const seen = cur <= le + .3 ? 1 : 0;
    const aa = a * (.35 + .65 * Math.max(on, seen * .6));
    const y = ly - 90 - (i % 2) * 120;
    g.save(); g.globalAlpha = aa * .6; g.strokeStyle = it.col; g.setLineDash([4, 6]); g.beginPath(); g.moveTo(x, ly - 12); g.lineTo(x, y + 30); g.stroke(); g.restore();
    glowDot(x, y, 14 + on * 16, it.col, aa, 2.2 + on);
    text(it.n, x, y - 42 - on * 12, 22 + on * 6, it.col, 'center', 'bold', aa);
  });
  // lupa
  const cx = lx(Math.pow(10, clamp(cur, -1, 5)));
  g.save(); g.strokeStyle = C.gold; g.lineWidth = 4; g.globalAlpha = a; g.beginPath(); g.arc(cx, ly, 22, 0, 7); g.stroke();
  g.beginPath(); g.moveTo(cx + 16, ly + 16); g.lineTo(cx + 34, ly + 34); g.stroke(); g.restore();
  const zx = clamp(cx, 1080, 1720);
  text('×' + Math.round(Math.pow(10, 5.2 - clamp(cur, -1, 5.2))).toLocaleString('en-US'), zx, ly - 300 + 10, 26, C.gold, 'center', 'bold', a * clamp((t - 2) / 1));
  text('zoom', zx, ly - 300 + 36, 18, C.gold, 'center', 'normal', a * clamp((t - 2) / 1));
};

V.atoms = (t, d) => {
  // sustrato de níquel
  const ox = 990, oy = 230, cols = 30, rows = 19, s = 27;
  for (let r = 0; r < rows; r++) for (let c = 0; c < cols; c++) {
    const x = ox + c * s + (r % 2) * s / 2, y = oy + r * s * .87;
    g.fillStyle = `rgba(90,120,170,${.25 + .12 * Math.sin(c * .7 + r)})`; g.beginPath(); g.arc(x, y, 11, 0, 7); g.fill();
  }
  const font = { I: ['111', '010', '010', '010', '010', '010', '111'], B: ['110', '101', '101', '110', '101', '101', '110'], M: ['10001', '11011', '10101', '10001', '10001', '10001', '10001'] };
  const targets = []; let cx = 0;
  for (const ch of 'IBM') { const m = font[ch]; m.forEach((row, ry) => [...row].forEach((v, rx) => { if (v === '1') targets.push([cx + rx, ry]); })); cx += m[0].length + 1; }
  const r = rng(11); const sc = 42, bx = 1400 - (cx - 1) * sc / 2, by = 330;
  const start = 4, per = (d - 8) / targets.length;
  let tip = null;
  targets.forEach(([gx, gy], i) => {
    const sx = 1000 + r() * 800, sy = 250 + r() * 470; const tx = bx + gx * sc, ty = by + gy * sc;
    const k = ease((t - start - i * per) / (per * 1.6));
    const x = lerp(sx, tx, k), y = lerp(sy, ty, k);
    if (k > 0 && k < 1) tip = [x, y];
    glowDot(x, y, 15, k >= 1 ? C.cyan : '#7fd6ff', 1, 2.2);
  });
  if (tip) {
    g.save(); g.fillStyle = '#c0c8d8'; g.globalAlpha = .9; g.beginPath(); g.moveTo(tip[0], tip[1] - 22); g.lineTo(tip[0] - 26, tip[1] - 120); g.lineTo(tip[0] + 26, tip[1] - 120); g.closePath(); g.fill();
    g.strokeStyle = C.gold; g.setLineDash([3, 5]); g.beginPath(); g.moveTo(tip[0], tip[1] - 22); g.lineTo(tip[0], tip[1] - 14); g.stroke(); g.restore();
    text('punta STM', tip[0] + 34, tip[1] - 90, 20, C.gold, 'left', 'bold', .9);
  }
  const done = clamp((t - start - targets.length * per) / 1);
  text('35 átomos de xenón sobre níquel', 1400, 770, 26, C.cyan, 'center', 'bold', .5 + .5 * done);
};

V.qdots = (t, d) => {
  const cols = ['#3b5bff', '#22b8ff', '#2ee88a', '#e8e23a', '#ff9a2e', '#ff3b3b'];
  const sizes = [2, 3, 4, 5, 6, 7];
  sizes.forEach((sz, i) => {
    const a = eout((t - 1 - i * .5) / .8); if (a <= 0) return;
    const x = 1010 + i * 150, y = 470, r = 14 + sz * 8;
    const pulse = 1 + .08 * Math.sin(t * 3 + i);
    // rayos de luz
    g.save(); g.globalAlpha = a * .5; g.strokeStyle = cols[i]; g.lineWidth = 3;
    for (let k = 0; k < 10; k++) { const an = k * .628 + t * .5, r1 = r + 18, r2 = r + 40 + 12 * Math.sin(t * 4 + k); g.beginPath(); g.moveTo(x + Math.cos(an) * r1, y + Math.sin(an) * r1); g.lineTo(x + Math.cos(an) * r2, y + Math.sin(an) * r2); g.stroke(); }
    g.restore();
    glowDot(x, y, r * pulse, cols[i], a, 2.4);
    text(sz + ' nm', x, y + 140, 26, C.text, 'center', 'bold', a);
  });
  const a2 = eout((t - 4.5) / 1);
  g.save(); g.globalAlpha = a2; const gr = g.createLinearGradient(1010, 0, 1760, 0); cols.forEach((c, i) => gr.addColorStop(i / 5, c));
  g.fillStyle = gr; rrect(1000, 660, 770, 14, 7); g.fill(); g.restore();
  text('más pequeño → azul', 1000, 715, 22, '#7fa0ff', 'left', 'bold', a2);
  text('más grande → rojo', 1770, 715, 22, '#ff7a7a', 'right', 'bold', a2);
  text('Mismo material: CdSe', 1385, 290, 30, C.gold, 'center', 'bold', a2);
};

// fullereno C60: vértices del icosaedro truncado
const PHI = (1 + Math.sqrt(5)) / 2;
const C60 = (() => {
  const base = [[0, 1, 3 * PHI], [1, 2 + PHI, 2 * PHI], [PHI, 2, Math.pow(PHI, 3)]];
  const set = new Map();
  for (const b of base) for (let sx of [1, -1]) for (let sy of [1, -1]) for (let sz of [1, -1]) {
    const v = [b[0] * sx, b[1] * sy, b[2] * sz];
    for (let k = 0; k < 3; k++) { const p = [v[k % 3], v[(k + 1) % 3], v[(k + 2) % 3]]; set.set(p.map(q => q.toFixed(3)).join(), p); }
  }
  const P = [...set.values()]; const E = [];
  for (let i = 0; i < P.length; i++) for (let j = i + 1; j < P.length; j++) { const d = Math.hypot(P[i][0] - P[j][0], P[i][1] - P[j][1], P[i][2] - P[j][2]); if (Math.abs(d - 2) < .01) E.push([i, j]); }
  return {P, E};
})();
function rot(p, ax, ay) { let [x, y, z] = p; let c = Math.cos(ay), s = Math.sin(ay); [x, z] = [x * c + z * s, -x * s + z * c]; c = Math.cos(ax); s = Math.sin(ax); [y, z] = [y * c - z * s, y * s + z * c]; return [x, y, z]; }
function draw3D(P, E, cx, cy, sc, ax, ay, col, a) {
  const Q = P.map(p => rot(p, ax, ay));
  g.save(); g.globalAlpha = a; g.lineWidth = 2.5;
  E.forEach(([i, j]) => { const z = (Q[i][2] + Q[j][2]) / 2; g.strokeStyle = col; g.globalAlpha = a * (.25 + .6 * (z / (sc ? 6 : 1) + 1) / 2); g.beginPath(); g.moveTo(cx + Q[i][0] * sc, cy + Q[i][1] * sc); g.lineTo(cx + Q[j][0] * sc, cy + Q[j][1] * sc); g.stroke(); });
  g.restore();
  Q.map((q, i) => [q, i]).sort((u, v) => u[0][2] - v[0][2]).forEach(([q]) => glowDot(cx + q[0] * sc, cy + q[1] * sc, 5.5, col, a * (.4 + .6 * clamp((q[2] + 5) / 10)), 1.8));
}
const TUBE = (() => {
  const P = [], E = [], n = 12, L = 22, R = 2.2, dz = .5;
  const idx = (i, j) => i * n + ((j % n) + n) % n;
  for (let i = 0; i < L; i++) for (let j = 0; j < n; j++) { const an = (j + (i % 2) * .5) / n * Math.PI * 2; P.push([(i - L / 2) * dz * 1.3, R * Math.cos(an), R * Math.sin(an)]); }
  for (let i = 0; i < L; i++) for (let j = 0; j < n; j++) { if (i + 1 < L) { E.push([idx(i, j), idx(i + 1, j)]); E.push([idx(i, j), idx(i + 1, j + (i % 2 ? 1 : -1))]); } }
  return {P, E};
})();
V.carbon = (t, d, sc, scT) => {
  const L = scT.lines; const t1 = L[1] ? L[1].start : 3, t2 = L[2] ? L[2].start : 10, t3 = L[3] ? L[3].start : 16;
  const seg = (a, b) => clamp((t - a) / .8) * clamp((b - t) / .8);
  const aC = t < t2 ? clamp((t - t1 + 1) / .8) * clamp((t2 - t) / .8) : 0;
  if (aC > 0) { draw3D(C60.P, C60.E, VX, VY, 52, t * .5, t * .7, C.gold, aC); text('C60 · fullereno', VX, 790, 30, C.gold, 'center', 'bold', aC); }
  const aT = seg(t2, t3);
  if (aT > 0) { draw3D(TUBE.P, TUBE.E, VX, VY, 52, .25, t * .9, C.cyan, aT); text('Nanotubo de carbono', VX, 790, 30, C.cyan, 'center', 'bold', aT); }
  const aG = clamp((t - t3) / .8);
  if (aG > 0) {
    const s = 34; const pts = [];
    for (let r = -7; r <= 7; r++) for (let c = -9; c <= 9; c++) {
      const x0 = c * s * 1.5, y0 = r * s * .866 * 2 + (c % 2 ? s * .866 : 0);
      for (const [dx, dy] of [[-s / 2, 0], [s / 2, 0]]) pts.push([x0 + dx, y0 + dy]);
    }
    const proj = ([x, y]) => { const w = Math.sin(x * .012 + t * 1.6) * 18 + Math.cos(y * .015 + t) * 12; return [VX + x * .95 + y * .25, VY + y * .45 + w - x * .05]; };
    const rr = 380;
    g.save(); g.strokeStyle = C.green; g.lineWidth = 2; g.globalAlpha = aG * .8;
    for (let i = 0; i < pts.length; i++) for (let j = i + 1; j < pts.length; j++) {
      const dx = pts[i][0] - pts[j][0], dy = pts[i][1] - pts[j][1];

    g.fillStyle = '#3a4a6a'; g.fillRect(1700, 180, 120, 620);
    for (let f = 0; f < 5; f++) { const an = -0.7 + f * .35; const fx = 1500 + Math.cos(an) * 160, fy = 490 + Math.sin(an) * 220;
      g.strokeStyle = '#7fbf6a'; g.lineWidth = 34; g.lineCap = 'round'; g.beginPath(); g.moveTo(1380, 490); g.lineTo(fx, fy); g.stroke();
      g.strokeStyle = '#c8f0a0'; g.lineWidth = 2;
      for (let k = 0; k < 14; k++) { const yy = fy - 20 + k * 3; g.beginPath(); g.moveTo(fx + 10, yy); g.lineTo(1700, yy + Math.sin(t * 2 + k) * 2); g.stroke(); } }
    glowDot(1340, 490, 60, '#5aa64a', 1, 1.2);
    text('millones de pelos (setas)', VX - 80, 250, 28, C.gold, 'center', 'bold', sw);
    text('fuerzas de van der Waals', VX - 80, 790, 26, C.cyan, 'center', 'bold', sw);
    g.restore();
  }
};

V.career = (t, d) => {
  const fields = [['Física', C.cyan], ['Química', C.gold], ['Biología', C.green], ['Computación', C.mag], ['Ingeniería', '#ff9a2e'], ['Medicina', '#ff5a5a']];
  const a = eout(t / 1); const R = 250;
  fields.forEach(([n, c], i) => {
    const aa = eout((t - 3 - i * .6) / .7); if (aa <= 0) return;
    const an = -Math.PI / 2 + i * Math.PI / 3 + t * .08; const x = VX + Math.cos(an) * R * aa, y = VY + Math.sin(an) * R * .95 * aa;
    g.save(); g.globalAlpha = aa * .7; g.strokeStyle = c; g.lineWidth = 3; g.setLineDash([6, 8]); g.lineDashOffset = -t * 30; g.beginPath(); g.moveTo(VX, VY); g.lineTo(x, y); g.stroke(); g.restore();
    glowDot(x, y, 58, c, aa * .9, 1.5); text(n, x, y + 6, n.length > 10 ? 16 : 19, '#061024', 'center', 'bold', aa);
  });
  glowDot(VX, VY, 95, '#2a6aff', a, 1.8);
  text('NANO', VX, VY + 18, 50, '#ffffff', 'center', 'bold', a);
};

V.outro = (t, d, sc, scT) => {
  V.intro(Math.min(t + 6, 40), d, sc, scT); // red hexagonal de fondo
  g.save(); g.fillStyle = '#050b1ae0'; g.fillRect(0, 0, W, H); g.restore();
  const L = scT.lines;
  const msg = [['Los problemas más grandes', C.text], ['se resuelven en lo más pequeño.', C.cyan]];
  msg.forEach(([m, c], i) => text(m, W / 2, 340 + i * 90, 72, c, 'center', 'bold', eout((t - .5 - i * .8) / 1) * clamp((L[1].start + 0.2 - t) / .6 + 1)));
  if (L[1] && t > L[1].start) {
    const a = eout((t - L[1].start) / 1);
    text('La próxima gran idea a escala nano', W / 2, 400, 64, C.text, 'center', 'bold', a * clamp((L[2].start - t) / .6 + 1) );
    text('podría ser la tuya.', W / 2, 490, 64, C.gold, 'center', 'bold', a * clamp((L[2].start - t) / .6 + 1));
  }
  if (L[2] && t > L[2].start) {
    const a = eout((t - L[2].start) / 1);
    text('ESTUDIA', W / 2, 330, 60, C.cyan, 'center', 'bold', a);
    g.save(); g.globalAlpha = a; g.font = `bold 140px ${FONT}`; g.textAlign = 'center';
    const gr = g.createLinearGradient(W / 2 - 600, 0, W / 2 + 600, 0); gr.addColorStop(0, C.cyan); gr.addColorStop(.5, '#ffffff'); gr.addColorStop(1, C.mag);
    g.fillStyle = gr; g.shadowColor = C.mag; g.shadowBlur = 40; g.fillText('NANOTECNOLOGÍA', W / 2, 490, 1500); g.restore();
    text('El futuro se construye átomo por átomo.', W / 2, 590, 44, C.gold, 'center', 'bold', eout((t - L[2].start - 1.2) / 1));
  }
};

V.refs = (t, d) => {
  const all = []; SCENES.forEach(s => (s.refs || []).forEach(r => { if (!all.includes(r)) all.push(r); }));
  text('Referencias', W / 2, 90, 52, C.cyan, 'center', 'bold', eout(t / .8));
  const half = Math.ceil(all.length / 2); let yL = 150, yR = 150;
  all.forEach((r, i) => {
    const left = i < half; const x = left ? 90 : 990; const lines = wrap((i + 1) + '. ' + r, 840, 17, 'normal');
    const a = eout((t - .3 - i * .08) / .6);
    lines.forEach((l, k) => text(l, x, (left ? yL : yR) + k * 22, 17, '#c8d4ea', 'left', 'normal', a));
    if (left) yL += lines.length * 22 + 10; else yR += lines.length * 22 + 10;
  });
  text('Video educativo · narración y animaciones generadas por computadora', W / 2, 1050, 18, C.dim, 'center', 'normal', eout((t - 2) / 1));
};

// ---------- composición ----------
window.renderAt = (T) => {
  let i = TL.scenes.findIndex(s => T >= s.start && T < s.start + s.dur); if (i < 0) i = TL.scenes.length - 1;
  const scT = TL.scenes[i], sc = SCENES[i], t = T - scT.start, d = scT.dur;
  background(T, sc.id === 'cierre');
  if (sc.visual !== 'intro' && sc.visual !== 'outro' && sc.visual !== 'refs') {
    const y = header(sc, t) || 300; bullets(sc, t, d, y + 10);
    // marco del visual
    g.save(); g.globalAlpha = eout(t / 1) * .5; rrect(960, 160, 880, 670, 26); g.fillStyle = '#081634aa'; g.fill(); g.strokeStyle = '#38e1ff33'; g.lineWidth = 2; g.stroke(); g.restore();
    g.save(); rrect(960, 160, 880, 670, 26); g.clip(); V[sc.visual](t, d, sc, scT); g.restore();
    refs(sc, t);
  } else V[sc.visual](t, d, sc, scT);
  subtitles(scT, t);
  if (sc.visual !== 'refs') progressBar(T);
  // fundido entre escenas
  const f = Math.min(clamp(t / .45), clamp((d - t) / .45));
  if (f < 1) { g.fillStyle = `rgba(2,5,14,${1 - f})`; g.fillRect(0, 0, W, H); }
};
window.init = (scenes, tl) => { SCENES = scenes; TL = tl; };
</script></body></html>
